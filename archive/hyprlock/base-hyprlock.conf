source = /home/$USER/.cache/wal/colors-hyprland
background {
    monitor =
    path = $wallpaper
    blur_size = 5
    blur_passes = 3
    brightness = .6
}

input-field {
    monitor = DP-5
    size = 6%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = $backgroundCol
    outer_color = $color9 $color9
    check_color = $color9 $color9
    fail_color = $color1 $color1
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 20
    placeholder_text = <i></i>
    fail_text = <b>FAIL</b>
    position = 0, -100
    halign = center
    valign = center
}

input-field {
    monitor = eDP-1
    size = 6%, 4%
    outline_thickness = 0
    dots_rounding = 4
    dots_spacing = .5
    inner_color = $backgroundCol
    outer_color = $color9 $color9
    check_color = $color9 $color9
    fail_color = $color1 $color1
    font_color = $color9
    font_family = CodeNewRoman Nerd Font Propo
    fade_on_empty = false
    shadow_color = rgba(0,0,0,0.5)
    shadow_passes = 2
    shadow_size = 2
    rounding = 20
    placeholder_text = <i></i>
    fail_text = <b>FAIL</b>
    position = 0, -100
    halign = center
    valign = center
}

label {
    monitor = DP-5
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = <i>Hello</i> <b>$USER</b>
    color = $color5
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor = DP-4
    text = cmd[update:1000] date +"<b>%A, %B %d, %Y</b>"
    color = $color4
    font_size = 40
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 350
    halign = center
    valign = center
}

label {
    monitor = eDP-1
    text = cmd[update:1000] date +"<b>%I</b>:<b>%M</b>"
    color = $color9
    font_size = 120
    font_family = CodeNewRoman Nerd Font Propo
    position = 0, 250
    halign = center
    valign = center
}

