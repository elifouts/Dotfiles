[general]
framerate = 30
bars = 36
autosens = 1
lower_cutoff_freq = 50
higher_cutoff_freq = 12000

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
noise_reduction = 72
