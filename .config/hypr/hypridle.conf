source = /home/$USER/.cache/wal/colors-hyprland

general {
    lock_cmd = ~/.config/hypr/utilities/session/lock.sh
    ignore_dbus_inhibit = /opt/spotify/spotify
}

listener {
    timeout = 800
    on-timeout = notify-send "System" "Locking in 3 minutes..." -i "$HOME/wallpapers/pywallpaper.jpg"
}

listener {
    timeout = 1000
    on-timeout = loginctl lock-session
    on-resume = notify-send "System" "Unlocked! Hey $USER" -i "$HOME/wallpapers/pywallpaper.jpg"
}

listener {
    timeout = 2400
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}