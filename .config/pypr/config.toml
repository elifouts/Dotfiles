[pyprland]
plugins = [
  "scratchpads"
]

[scratchpads.term]
animation = "fromTop"
command = "kitty --class kitty-dropterm"
class = "kitty-dropterm"
skip_windowrules = ["group"]
position = "17% 6%"
size = "65% 60%"
offset = "200%"

[scratchpads.music]
animation = "fromBottom"
command = "kitty --class kitty-pulsemixer -e pulsemixer"
class = "kitty-pulsemixer"
skip_windowrules = ["group"]
size = "50% 20%"
offset = "200%"

[scratchpads.taskbar]
animation = "fromLeft"
command = "kitty --class kitty-taskbar -e btm"
class = "kitty-taskbar"
skip_windowrules = ["group"]
size = "30% 80%"
offset = "200%"

[scratchpads.spotify]
animation = "fromTop"
command = "spotify-launcher"
class = "re:(?i)^spotify$"
skip_windowrules = ["group"]
match_by = "class"
process_tracking = false
position = "15% 20%"
size = "70% 60%"
offset = "200%"

[scratchpads.packages]
animation = "fromTop"
command = "kitty --class kitty-packages -e /home/$USER/Dotfiles/.config/hypr/utilities/packages/package-tui.sh"
class = "kitty-packages"
skip_windowrules = ["group"]
position = "8% 5%"
size = "84% 88%"
offset = "200%"
